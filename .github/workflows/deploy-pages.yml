# 把 public/ 目录发布到 GitHub Pages
# ---------------------------------------------------------------------------
# 站点根目录是 public/（不是仓库根），所以走 artifact 上传方式，
# 而不是"从分支的 / 或 /docs 发布"（那两种不支持任意子目录）。
#
# enablement: true 让工作流自己启用 Pages —— 这样仓库设置里
# 不需要手工点一次「Source: GitHub Actions」。
name: Deploy to GitHub Pages

# 暂时只留手动触发：仓库里的 GITHUB_TOKEN 没有创建 Pages 站点的权限
# （实测报 Resource not accessible by integration），
# 需要先在 Settings → Pages → Source 选一次 "GitHub Actions"。
# 启用之后，把下面的 workflow_dispatch 换回 push 触发即可自动发布。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用并配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传站点（public/ 即站点根目录）
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
